# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Quick cache pipeline

on:
  push:
    branches: [ "main", "Fixing-pipeline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type (major, minor, patch)'
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

jobs:
  build_test:
    runs-on: ubuntu-latest
#    if: ${{ (github.event_name != 'workflow_dispatch') && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Check Java version
      run: java -version

    - name: Check maven version
      run: mvn --version

    - name: Configure Git user
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"

    - name: Create Maven settings.xml
      run: |
        mkdir -p ~/.m2
        echo "<settings>
                <servers>
                  <server>
                    <id>central</id>
                    <username>${{ secrets.SONATYPE_USERNAME }}</username>
                    <password>${{ secrets.SONATYPE_PASSWORD }}</password>
                  </server>
                </servers>
              </settings>" > ~/.m2/settings.xml

    - name: View settings.xml
      run: cat ~/.m2/settings.xml

    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

    - name: Set GPG Passphrase
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "MAVEN_GPG_PASSPHRASE=${GPG_PASSPHRASE}" >> $GITHUB_ENV

    - name: List GPG keys
      run: gpg --list-secret-keys

    - name: Get current version
      id: get_version
      run: echo ::set-output name=version::$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

    - name: Calculate release version
      id: calc_version
      run: |
        current_version=${{ steps.get_version.outputs.version }}
        IFS='.' read -ra version_parts <<< "$current_version"
        major=${version_parts[0]}
        minor=${version_parts[1]}
        patch=${version_parts[2]}
        
        case "${{ github.event.inputs.releaseType }}" in
          major)
            new_version=$((major)).0.0
            next_dev_version=$((major + 1)).0.1
            ;;
          minor)
            new_version=$major.$((minor)).0
            next_dev_version=$major.$((minor + 1)).1
            ;;
          patch)
            new_version=$major.$minor.$((patch))
            next_dev_version=$major.$minor.$((patch + 1))
            ;;
          *)
            echo "Invalid release type. Defaulting to patch."
            new_version="$major.$minor.$((patch))"
            next_dev_version="$major.$minor.$((patch + 1))"
            ;;
        esac
        
        echo ::set-output name=release_version::$new_version
        echo ::set-output name=next_dev_version::$next_dev_version

    - name: Prepare Release
      run: |
        mvn -B release:prepare \
        -DreleaseVersion=${{ steps.calc_version.outputs.release_version }} \
        -DdevelopmentVersion=${{ steps.calc_version.outputs.next_dev_version }}-SNAPSHOT \
        -DtagNameFormat=v@{project.version} \
        -DpushChanges=false

    - name: Push changes
      run: |
        git push
        git push --tags

    - name: publish
      run: mvn -B release:perform -DlocalCheckout=true -s ~/.m2/settings.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  publish_package_github:
    runs-on: ubuntu-latest
    needs: build_test
    if: ${{ github.event_name == 'workflow_dispatch'}}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - run: mvn --batch-mode --update-snapshots verify
    - run: mkdir staging && cp target/*.jar staging
    - uses: actions/upload-artifact@v4
      with:
        name: package
        path: staging
